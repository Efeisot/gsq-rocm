# GSQ smoke-test configuration for Llama-3.2-1B on gfx1200 (16 GB class GPU).
#
#   python main.py --config configs/rocm/gfx1200_llama32_1b_2bit.yaml --max-layers 2

model:
  name: "meta-llama/Llama-3.2-1B-Instruct"   # gated: accept the HF license first
  device: "cuda"
  dtype: "bfloat16"

data:
  dataset_name: "fineweb_edu"
  batch_size: 4
  num_samples: 256
  val_samples: 32
  max_length: 1024
  num_workers: 2
  open_thoughts_max_samples: 1000

quantization:
  gsq_bits: 2
  init_method: "gptq"
  gsq_enabled: true
  start_layer: 0
  self_attn: false
  std: 0.01
  temperature: [2.0, 0.05]
  scale: [100, 500]
  groupsize: 128
  strength: 6
  logits_dtype: "bfloat16"

training:
  num_epochs: 2
  device_microbatch_size: 1
  lr1: 0.0001
  lr2: 0.00005
  weight_decay: 1.0
  checkpoint_dir: "runtime/checkpoints"
  log_dir: "runtime/logs"
  eval_baseline: false
  ppl_eval_every_n_layers: 0
  act_cache_dir: "runtime/act_cache"

gptq:
  nsamples: 128
  wbits: 2
  sym: true
  percdamp: 0.1
  blocksize: 128
  groupsize: 128

distributed:
  timeout_hours: 1.0

wandb: false

logging:
  gumbel_step_log_interval: 50
  step_report_divisor: 5
  calib_report_divisor: 10
  ppl_report_divisor: 10
  batch_report_divisor: 5
